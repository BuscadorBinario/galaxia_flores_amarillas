<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Una Galaxia para Ti</title>
<style>
  :root {
    --ui-bg: rgba(24, 18, 0, .55);
    --ui-border: rgba(255, 205, 70, .45);
    --ui-text: #fff4c2;
    --gold: #ffc933;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #030300;
    font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
  }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, rgba(255, 210, 60, .10), rgba(0,0,0,0) 45%, rgba(0,0,0,.65) 100%);
  }
  .hint {
    position: fixed; bottom: max(26px, env(safe-area-inset-bottom)); left: 64px; right: 64px; text-align: center;
    color: rgba(255, 235, 170, .8); font-size: 13px; letter-spacing: .03em;
    pointer-events: none; transition: opacity 1.5s;
  }
  .round { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--ui-border); background: var(--ui-bg); color: var(--ui-text); font-size: 20px; cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .round.on { background: linear-gradient(135deg, #ffe066, #ffb300); color: #3a2600; box-shadow: 0 0 22px rgba(255,190,40,.5); }
  .round:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #letterBtn { left: max(16px, env(safe-area-inset-left)); }
  #music { right: max(16px, env(safe-area-inset-right)); }
  #fs { right: calc(max(16px, env(safe-area-inset-right)) + 56px); }
  #storyBtn { left: max(16px, env(safe-area-inset-left)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 56px); }
  #wishBtn { left: max(16px, env(safe-area-inset-left)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 112px); }
  .counter { position: fixed; top: 14px; left: 0; right: 0; text-align: center; padding: 0 16px; pointer-events: none;
    font: italic 15px/1.4 Georgia, "Times New Roman", serif; color: #ffe9a6; text-shadow: 0 0 12px rgba(255,190,40,.6); }
  .counter[hidden] { display: none; }
  .intro { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center; animation: introOut 1.4s ease 4.6s forwards; }
  .intro.play { display: flex; }
  .intro-para { font: italic 22px Georgia, "Times New Roman", serif; color: var(--ui-text); letter-spacing: .06em;
    opacity: 0; animation: lineIn 1.2s ease .3s forwards; }
  .intro-name { font: italic 600 clamp(38px, 9vw, 72px)/1.1 Georgia, "Times New Roman", serif; color: #ffd54a; padding: 0 20px;
    text-shadow: 0 0 30px rgba(255,190,40,.7); opacity: 0; animation: lineIn 1.6s ease 1s forwards; }
  .intro-from { margin-top: 10px; font: italic 20px Georgia, "Times New Roman", serif; color: var(--ui-text);
    opacity: 0; animation: lineIn 1.2s ease 2s forwards; }
  @keyframes introOut { to { opacity: 0; visibility: hidden; } }
  .start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 42%, #33230a 0%, #120c00 45%, #030300 100%);
    transition: opacity 1.2s ease, visibility 1.2s; }
  .start.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .start-emoji { font-size: 64px; filter: drop-shadow(0 0 24px rgba(255,190,40,.75)); animation: startFloat 4s ease-in-out infinite; }
  .start-lead { font: italic 18px Georgia, "Times New Roman", serif; color: var(--ui-text); letter-spacing: .06em; }
  .start-btn { max-width: 88vw; padding: 16px 32px; border: 0; border-radius: 999px; cursor: pointer;
    font: italic 600 clamp(18px, 4.8vw, 24px)/1.3 Georgia, "Times New Roman", serif; color: #3a2600;
    background: linear-gradient(135deg, #ffe066, #ffb300); box-shadow: 0 0 30px rgba(255,190,40,.55);
    animation: startPulse 2.6s ease-in-out infinite; }
  .start-btn:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .start-canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .start.playing .start-canvas { opacity: 1; }
  .start.playing .start-emoji, .start.playing .start-lead, .start.playing .start-btn { opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  .bloom-caption { position: absolute; left: 0; right: 0; top: 78%; padding: 0 20px; text-align: center; pointer-events: none;
    font: italic 600 clamp(18px, 4.6vw, 26px)/1.3 Georgia, "Times New Roman", serif; color: #ffe066;
    text-shadow: 0 0 22px rgba(255,190,40,.7); opacity: 0; transition: opacity .9s ease; }
  .bloom-caption.show { opacity: 1; }
  @keyframes startFloat { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
  @keyframes startPulse { 0%, 100% { box-shadow: 0 0 22px rgba(255,190,40,.45); } 50% { box-shadow: 0 0 46px rgba(255,190,40,.85); } }
  .poem.letter .poem-card { width: min(92vw, 500px); }
  .poem.letter .poem-lines p { text-align: left; font-size: 17px; margin-bottom: 14px; }
  .player { position: fixed; z-index: 8; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 58px);
    width: min(92vw, 360px); max-height: min(74vh, 560px); display: flex; flex-direction: column; gap: 10px; padding: 14px;
    border-radius: 20px; background: rgba(20,14,0,.84); border: 1px solid var(--ui-border); box-shadow: 0 0 50px rgba(255,190,40,.2);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: poemIn .3s ease both; }
  .player[hidden] { display: none; }
  .pl-head { display: flex; align-items: center; gap: 12px; padding-right: 30px; position: relative; }
  .pl-cover { position: relative; width: 64px; height: 64px; flex: none; border-radius: 12px; overflow: hidden;
    background: linear-gradient(135deg, #5a3e00, #2a1c00); display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-size: 26px; box-shadow: 0 0 18px rgba(255,190,40,.25); }
  .pl-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pl-cover img[hidden] { display: none; }
  .pl-info { min-width: 0; flex: 1; }
  .pl-title { font: italic 600 17px/1.25 Georgia, "Times New Roman", serif; color: #ffd54a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-artist { font-size: 13px; color: rgba(255,235,170,.7); margin-top: 2px; }
  .pl-x { position: absolute; top: -4px; right: -6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent;
    color: var(--ui-text); font-size: 14px; cursor: pointer; }
  .pl-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ui-text); font-variant-numeric: tabular-nums; }
  .pl-bar input { flex: 1; min-width: 0; }
  .player input[type=range] { accent-color: #ffc933; }
  .pl-ctrl { display: flex; align-items: center; gap: 6px; }
  .pl-ctrl button { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--ui-border); background: transparent;
    color: var(--ui-text); font-size: 16px; cursor: pointer; }
  .pl-ctrl .pl-main { width: 48px; height: 48px; border: 0; background: linear-gradient(135deg, #ffe066, #ffb300); color: #3a2600; font-size: 18px; }
  .pl-ctrl button.on { background: rgba(255,200,60,.25); border-color: #ffc933; }
  .pl-ctrl button:focus-visible, .pl-x:focus-visible, .pl-item:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .pl-vol { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; margin-left: 6px; font-size: 14px; }
  .pl-vol input { width: 100%; min-width: 0; }
  .pl-error { font-size: 13px; line-height: 1.4; color: #ffb3a0; background: rgba(120,30,0,.35); padding: 8px 10px; border-radius: 10px; }
  .pl-error[hidden] { display: none; }
  .pl-list { list-style: none; margin: 0; padding: 4px 0 0; overflow-y: auto; flex: 1; min-height: 0; border-top: 1px solid rgba(255,205,70,.2); }
  .pl-item { display: flex; align-items: center; gap: 10px; padding: 9px 6px; cursor: pointer; border-radius: 8px; color: var(--ui-text); font-size: 14px; }
  .pl-item:hover { background: rgba(255,200,60,.12); }
  .pl-item.active { color: #ffd54a; background: rgba(255,200,60,.16); }
  .pl-ic { width: 18px; text-align: center; flex: none; font-size: 12px; }
  .pl-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-d { font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
  .np { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); transform: translateX(-50%) translateY(8px);
    max-width: 86vw; padding: 8px 16px; border-radius: 999px; background: var(--ui-bg); border: 1px solid var(--ui-border);
    color: #ffe9a6; font: italic 14px Georgia, "Times New Roman", serif; opacity: 0; pointer-events: none;
    transition: opacity .5s, transform .5s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .np.show { opacity: 1; transform: translateX(-50%); }
  .poem { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(2,2,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: poemIn .35s ease both; }
  .poem[hidden] { display: none; }
  .poem-card { position: relative; width: min(92vw, 440px); max-height: 82vh; overflow-y: auto; padding: 34px 28px 30px;
    border-radius: 22px; text-align: center;
    background: radial-gradient(ellipse at 50% 0%, rgba(90,62,0,.55), rgba(20,14,0,.92) 70%);
    border: 1px solid var(--ui-border); box-shadow: 0 0 70px rgba(255,190,40,.22); }
  .poem-flower { font-size: 34px; }
  .poem-card h2 { margin: 6px 0 18px; font: italic 600 30px/1.2 Georgia, "Times New Roman", serif;
    color: #ffd54a; text-shadow: 0 0 18px rgba(255,190,40,.55); }
  .poem-lines p { margin: 0 0 6px; font: 18px/1.65 Georgia, "Times New Roman", serif; color: var(--ui-text);
    opacity: 0; animation: lineIn .8s ease forwards; }
  .poem-close { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--ui-border); background: transparent; color: var(--ui-text); font-size: 16px; cursor: pointer; }
  .poem-close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @keyframes poemIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes lineIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  /* Frases cinematográficas del espectáculo */
  .show-caption { position: fixed; left: 0; right: 0; top: 17%; z-index: 4; padding: 0 24px; text-align: center; pointer-events: none;
    font: italic 600 clamp(20px, 5vw, 36px)/1.3 Georgia, "Times New Roman", serif; color: #fff1a8;
    text-shadow: 0 0 24px rgba(255,190,40,.85), 0 0 4px rgba(90,50,0,.8);
    opacity: 0; transform: translateY(14px) scale(.96); filter: blur(6px);
    transition: opacity 1.6s ease, transform 1.6s ease, filter 1.6s ease; }
  .show-caption.show { opacity: 1; transform: none; filter: none; }
  @media (prefers-reduced-motion: reduce) { .poem, .poem-lines p { animation: none; opacity: 1; } .intro, .intro.play { display: none; } .start-emoji, .start-btn { animation: none; } .show-caption { transition: none; } }
</style>
</head>
<body>
<div class="vignette"></div>

<div class="start" id="start">
  <div class="start-emoji" aria-hidden="true">🌻</div>
  <div class="start-lead">Tengo algo para ti</div>
  <button class="start-btn" id="startBtn" type="button">Para ti, mi amor</button>
  <canvas class="start-canvas" id="bloom" aria-hidden="true"></canvas>
  <div class="bloom-caption" id="bloomCaption" aria-hidden="true"></div>
</div>
<div class="hint" id="hint">Toca las frases y el corazón amarillo para leer poemas · 📖 nuestra historia · 🌼 mensaje sorpresa · toca el cielo para lanzar fuegos artificiales</div>

<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-para">Para</div>
  <div class="intro-name" id="introName"></div>
  <div class="intro-from" id="introFrom"></div>
</div>
<div class="counter" id="counter" hidden></div>
<div class="show-caption" id="showCaption" aria-live="polite"></div>
<button class="round" id="letterBtn" type="button" aria-label="Leer la carta">💌</button>
<button class="round" id="storyBtn" type="button" aria-label="Leer nuestra historia">📖</button>
<button class="round" id="wishBtn" type="button" aria-label="Recibir un mensaje sorpresa">🌼</button>
<button class="round" id="fs" type="button" aria-label="Pantalla completa">⛶</button>
<button class="round" id="music" type="button" aria-expanded="false" aria-controls="player" aria-label="Abrir reproductor de música">♪</button>

<div class="player" id="player" hidden role="region" aria-label="Reproductor de música">
  <div class="pl-head">
    <div class="pl-cover"><span aria-hidden="true">♪</span><img id="plCoverImg" alt="" hidden></div>
    <div class="pl-info"><div class="pl-title" id="plTitle">—</div><div class="pl-artist" id="plArtist"></div></div>
    <button class="pl-x" id="plClose" type="button" aria-label="Cerrar reproductor">✕</button>
  </div>
  <div class="pl-bar"><span id="plCur">0:00</span><input id="plSeek" type="range" min="0" max="1000" value="0" aria-label="Progreso de la canción"><span id="plDur">0:00</span></div>
  <div class="pl-ctrl">
    <button id="plShuffle" type="button" aria-pressed="false" aria-label="Orden aleatorio">🔀</button>
    <button id="plPrev" type="button" aria-label="Canción anterior">⏮</button>
    <button id="plPlay" class="pl-main" type="button" aria-label="Reproducir o pausar">▶</button>
    <button id="plNext" type="button" aria-label="Canción siguiente">⏭</button>
    <label class="pl-vol"><span aria-hidden="true">🔊</span><input id="plVol" type="range" min="0" max="100" value="80" aria-label="Volumen"></label>
  </div>
  <div class="pl-error" id="plError" hidden></div>
  <ul class="pl-list" id="plList"></ul>
</div>
<div class="np" id="np" aria-live="polite"></div>


<div class="poem" id="poem" hidden role="dialog" aria-modal="true" aria-labelledby="poemTitle">
  <div class="poem-card">
    <button class="poem-close" id="poemClose" type="button" aria-label="Cerrar poema">✕</button>
    <div class="poem-flower" id="poemIcon" aria-hidden="true">🌻</div>
    <h2 id="poemTitle"></h2>
    <div class="poem-lines" id="poemLines"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  /* ============ CONFIGURACIÓN (edita aquí) ============ */
  const CONFIG = {
    para: 'Mi amor',  // nombre o apodo de tu novia. Ej: 'Valeria'
    de: '',            // tu nombre (opcional)
    fecha: '',         // 'AAAA-MM-DD' de cuando empezaron a salir, para mostrar el tiempo juntos (opcional). Ej: '2019-08-15'
    textoAnimacion: 'Una flor para el amor de mi vida', // texto que aparece durante la animación al pulsar el botón de inicio
    carpetaMusica: '', // carpeta de los .mp3 y sus portadas .png. Vacío = junto a este archivo. Ej: 'musica/'
    musicaAutomatica: true, // empieza a sonar en el primer toque (los navegadores exigen un toque para permitir sonido)
    canciones: [
      { file: 'Princesa de mi corazón ❤️.mp3', portada: 'Princesa de mi corazón.png', titulo: 'Princesa de mi corazón ❤️', artista: 'Para ti 🌻', duracion: '6:54' },
      { file: 'No Dejes Que Apaguen Tu Brillo.mp3', portada: 'No Dejes Que Apaguen Tu Brillo.png', titulo: 'No Dejes Que Apaguen Tu Brillo', artista: 'Para ti 🌻', duracion: '5:04' },
      { file: 'PÁGINAS DE LUZ.mp3', portada: 'PÁGINAS DE LUZ.png', titulo: 'PÁGINAS DE LUZ', artista: 'Para ti 🌻', duracion: '5:58' },
      { file: 'ESPÉRAME HASTA QUE LLEGUE.mp3', portada: 'ESPÉRAME HASTA QUE LLEGUE.png', titulo: 'ESPÉRAME HASTA QUE LLEGUE', artista: 'Para ti 🌻', duracion: '4:09' },
      { file: 'CUANDO TÚ QUIERAS.mp3', portada: 'CUANDO TÚ QUIERAS.png', titulo: 'CUANDO TÚ QUIERAS', artista: 'Para ti 🌻', duracion: '5:07' },
      { file: 'Cuando llegue a ti.mp3', portada: 'Cuando llegue a ti.png', titulo: 'Cuando llegue a ti', artista: 'Para ti 🌻', duracion: '6:11' },
      { file: 'Si Me Dejas Conocerte.mp3', portada: 'Si Me Dejas Conocerte.png', titulo: 'Si Me Dejas Conocerte', artista: 'Para ti 🌻', duracion: '4:28' },
      { file: 'La Chica de la Mirada Encantadora.mp3', portada: 'La Chica de la Mirada Encantadora.png', titulo: 'La Chica de la Mirada Encantadora', artista: 'Para ti 🌻', duracion: '4:57' },
      { file: 'La Chica de la Mirada.mp3', portada: 'La Chica de la Mirada.png', titulo: 'La Chica de la Mirada', artista: 'Para ti 🌻', duracion: '3:27' },
      { file: 'Donde Empieza Tu Luz.mp3', portada: 'Donde Empieza Tu Luz.png', titulo: 'Donde Empieza Tu Luz', artista: 'Para ti 🌻', duracion: '3:34' },
      { file: 'Cuando Te Miro.mp3', portada: 'Cuando Te Miro.png', titulo: 'Cuando Te Miro', artista: 'Para ti 🌻', duracion: '4:29' },
      { file: 'Me Gustas Más Cada Día.mp3', portada: 'Me Gustas Más Cada Día.png', titulo: 'Me Gustas Más Cada Día', artista: 'Para ti 🌻', duracion: '5:01' }
    ],
    textosShow: [      // frases que aparecen en grande, una a una, durante el espectáculo de luces
      'Gracias por elegirme cada día 🌻',
      'Cada flor amarilla es un recuerdo contigo',
      'Que esta vida te la pase amándote',
      'Un amor que sigue floreciendo 💛',
      'Eres la luz de mis días',
      'Contigo todo lugar se siente como el hogar',
      'Te mereces todas las flores del mundo'
    ],
    carta: [           // {para} se reemplaza por el nombre de arriba (puedes usarlo o no)
      'Hay cosas que uno guarda para decirlas bien, con calma, sin prisa. Esta carta es una de esas cosas: quiero que sepas, sin adornos ni exageraciones, lo que siento por ti.',
      'Desde que llegaste, los días cambiaron de color. No es que antes estuvieran mal, es que contigo se sienten distintos: más livianos, más míos, más completos.',
      'Me gusta la forma en la que me escuchas, la manera en que te ríes de tus propios chistes, y cómo incluso en los días difíciles encuentras algo bueno que decir.',
      'No necesito que todo sea perfecto para saber que esto es real. Elijo quedarme en lo simple: en las conversaciones largas, en los silencios cómodos, en cuidarte cuando lo necesitas.',
      'Gracias por tu paciencia, por tu cariño, y por dejarme ser parte de tu vida. Prometo seguir eligiéndote, hoy y todos los días que vengan.',
      'Te quiero, y no de cualquier forma: te quiero de la forma en la que uno quiere lo que de verdad le importa.'
    ],
    historia: [        // botón 📖: puedes editar estos momentos con los tuyos reales
      '✨ El día que nos conocimos. Un momento que pareció cualquier otro, pero que terminó cambiándolo todo.',
      '💬 Las primeras conversaciones. Fueron creciendo poco a poco, hasta que hablar contigo se volvió de lo mejor del día.',
      '💛 El momento en que supe que era algo serio. No hubo un solo instante exacto: fue una suma de pequeños detalles que me convencieron.',
      '🤝 Aprender a construir juntos. Con aciertos, con errores, y con la decisión de seguir intentándolo.',
      '🌻 Hoy. Una historia que sigue escribiéndose, contigo, un día a la vez.'
    ],
    mensajes: [        // botón 🌼: cada toque muestra uno distinto
      'Que hoy tengas un día tan lindo como tu sonrisa.',
      'Gracias por ser mi lugar seguro.',
      'Contigo hasta lo simple se siente especial.',
      'Eres de las personas que la vida no debería dejar ir, y yo no pienso hacerlo.',
      'Tu risa es de mis sonidos favoritos.',
      'A tu lado el tiempo se siente distinto: mejor.',
      'Te mereces todas las flores amarillas del mundo.',
      'Cada día contigo confirma que elegí bien.',
      'Ojalá sigamos escribiendo esta historia por mucho tiempo más.',
      'Contigo aprendí que el amor también se construye en lo cotidiano.',
      'Hoy brillas más que cualquier girasol. No lo olvides.',
      'Gracias por quedarte incluso cuando no es fácil.',
      'Eres luz en mis días, incluso en los grises.',
      'Te deseo un tiempo lleno de risas, calma y momentos que valgan la pena recordar.',
      'Prometo seguir eligiéndote, hoy y siempre.',
      'Eres la prueba de que el amor bien cuidado se queda.',
      'Un día llegaste, y me alegra tanto que te hayas quedado.',
      'Gracias por hacer más bonito cada día con solo estar.'
    ]
  };
  /* ==================================================== */

  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  /* ---------- Escena básica ---------- */
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030300);
  scene.fog = new THREE.FogExp2(0x030300, 0.002);

  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 1200);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);

  const U = { uTime: { value: 0 }, uPR: { value: DPR } };

  /* ---------- Partículas con shader (brillo suave + parpadeo) ---------- */
  const vert = `
    attribute vec3 aColor; attribute float aSize; attribute float aPhase;
    uniform float uTime, uPR, uJit;
    varying vec3 vColor; varying float vTw;
    void main() {
      vec3 p = position;
      p += vec3(sin(uTime*.8 + aPhase*6.283), cos(uTime*.7 + aPhase*11.0), sin(uTime*.6 + aPhase*8.0)) * uJit;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float tw = .65 + .35 * sin(uTime * (1.5 + aPhase*2.5) + aPhase*40.0);
      gl_PointSize = aSize * uPR * tw * (300.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      vColor = aColor; vTw = tw;
    }`;

    varying vec3 vColor; varying float vTw;
    uniform float uFade;
    void main() {
      float d = length(gl_PointCoord - .5);
      if (d > .5) discard;
      float a = pow(1.0 - d*2.0, 2.0);
      gl_FragColor = vec4(vColor * (.8 + .6*vTw), a * uFade);

  }

  function swirlTex() {
    const S = 512, c = newCanvas(S, S), x = c.getContext('2d');

        const t = k / 700, r = t * 235, a = arm * Math.PI / 2 + t * 7.5;

        const g = x.createRadialGradient(px, py, 0, px, py, rad);
        g.addColorStop(0, `rgba(255,215,90,${(1 - t) * .55})`);
        g.addColorStop(1, 'rgba(255,170,0,0)');
        x.fillStyle = g; x.beginPath(); x.arc(px, py, rad, 0, TAU); x.fill();

    }
    const g = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, 110);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,240,170,.9)');

  function drawSunflower(x, cx, cy, R, rot) {
    x.save(); x.translate(cx, cy); x.rotate(rot);
    const layers = [{ n: 18, len: 1, w: .2, off: 0, c1: '#ff9f00', c2: '#ffcf1f' },
                    { n: 18, len: .9, w: .2, off: Math.PI / 18, c1: '#ffb300', c2: '#ffe44d' }];
    layers.forEach(L => {
      for (let i = 0; i < L.n; i++) {
        x.save(); x.rotate(i / L.n * TAU + L.off);
        const gr = x.createLinearGradient(0, R * .25, 0, R * L.len);
        gr.addColorStop(0, L.c1); gr.addColorStop(1, L.c2);
        x.fillStyle = gr; x.strokeStyle = 'rgba(200,110,0,.55)'; x.lineWidth = Math.max(.6, R * .012);
        x.beginPath(); x.moveTo(0, R * .25);
        x.quadraticCurveTo(R * L.w * 1.1, R * .6 * L.len, 0, R * L.len);
        x.quadraticCurveTo(-R * L.w * 1.1, R * .6 * L.len, 0, R * .25);
        x.fill(); x.stroke(); x.restore();
      }
    });
    const cg = x.createRadialGradient(0, 0, 0, 0, 0, R * .36);
    cg.addColorStop(0, '#6b4218'); cg.addColorStop(.7, '#3d2410'); cg.addColorStop(1, '#2a180a');
    x.fillStyle = cg; x.beginPath(); x.arc(0, 0, R * .36, 0, TAU); x.fill();
    for (let i = 0; i < 140; i++) {
      const r = Math.sqrt(i) * R * .028, a = i * 2.39996;

      x.fillStyle = `rgba(190,130,55,${.35 + Math.random() * .3})`;
      x.beginPath(); x.arc(Math.cos(a) * r, Math.sin(a) * r, R * .018, 0, TAU); x.fill();
    }
    x.restore();
  }

  // --- Esculturas que se transforman (GPU) ---
  const morphVert = `

  // Animación: un girasol florece, brilla, se acerca a la cámara y estalla en luz dorada
  function playBloom(onReveal) {
    const cv = document.getElementById('bloom'), g = cv.getContext('2d'), cap = document.getElementById('bloomCaption');

    cap.textContent = CONFIG.textoAnimacion || '';

    fit(); addEventListener('resize', fit);

    const sparkles = Array.from({ length: 70 }, () => ({ a: rand(0, TAU), sp: rand(.25, .6), ph: Math.random(), sz: rand(1.2, 3.2), d0: rand(1.05, 1.4) }));
    const fall = Array.from({ length: 34 }, () => ({ x: Math.random(), y0: Math.random(), v: rand(.05, .13), sz: rand(7, 15), ph: rand(0, TAU), rot: rand(-2, 2) }));
    const layers = [
      { n: 20, len: 1,  w: .2, off: 0,           start: 0,   c1: '#ff9f00', c2: '#ffcf1f' },
      { n: 20, len: .9, w: .2, off: Math.PI / 20, start: .18, c1: '#ffb300', c2: '#ffe44d' }
    ];
    const t0 = performance.now();
    let revealed = false;

    function tick(nowMs) {
      if (!startEl.isConnected) { removeEventListener('resize', fit); return; }
      requestAnimationFrame(tick);
      const t = Math.max(0, (nowMs - t0) / 1000);
      const b = clamp((t - .3) / 2.3);          // florecer
      const z = clamp((t - 3.1) / 1.0);         // acercarse a la cámara
      const cx = W / 2, cy = H * .46, R = Math.min(W, H) * .27;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);

      // resplandor
      const ha = Math.min(.75, .55 * easeOut(clamp(b * 1.2)) * (1 + .12 * Math.sin(t * 3)));
      const gl = g.createRadialGradient(cx, cy, 0, cx, cy, R * 2.6);
      gl.addColorStop(0, 'rgba(255,214,90,' + ha + ')');
      gl.addColorStop(.5, 'rgba(255,170,30,' + (ha * .25) + ')');
      gl.addColorStop(1, 'rgba(255,170,30,0)');
      g.fillStyle = gl; g.fillRect(0, 0, W, H);

      // pétalos que caen
      for (const p of fall) {
        const y = ((p.y0 + t * p.v) % 1.15) * (H + 40) - 20;
        const x = p.x * W + Math.sin(t * .9 + p.ph) * 26;
        g.save(); g.translate(x, y); g.rotate(t * p.rot + p.ph);
        g.globalAlpha = .55 * clamp(t / .8) * (1 - z);
        g.fillStyle = '#ffcf33'; g.beginPath(); g.ellipse(0, 0, p.sz * .38, p.sz, 0, 0, TAU); g.fill();
        g.restore();

      g.globalAlpha = 1;

      const breathe = 1 + .015 * Math.sin(t * 2.2), zs = (1 + 26 * z * z * z) * breathe;
      g.save(); g.translate(cx, cy); g.scale(zs, zs); g.rotate(-.5 + .5 * easeOut(b) + t * .04);
      for (const L of layers) {
        for (let i = 0; i < L.n; i++) {
          const pp = easeBack(clamp((b - L.start - (i / L.n) * .3) / .45));
          if (pp <= .001) continue;
          const len = .25 + (L.len - .25) * pp;
          g.save(); g.rotate(i / L.n * TAU + L.off + (1 - clamp(pp)) * .7);
          const gr = g.createLinearGradient(0, R * .25, 0, R * len);
          gr.addColorStop(0, L.c1); gr.addColorStop(1, L.c2);
          g.fillStyle = gr; g.strokeStyle = 'rgba(200,110,0,.55)'; g.lineWidth = Math.max(.8, R * .012);

        g.fillStyle = 'rgba(190,130,55,.6)';
        for (let i = 0; i < seeds; i++) {

      if (t > 1) {

      // destello final que se funde con la galaxia
      const fa = clamp((t - 3.35) / .55);
      if (fa > 0) { g.fillStyle = 'rgba(255,240,180,' + fa + ')'; g.fillRect(0, 0, W, H); }

      cap.classList.toggle('show', t > 1.2 && t < 3.0);
      if (!revealed && t >= 3.9) { revealed = true; onReveal(); }
    }
    requestAnimationFrame(tick);
  }

  startBtn.addEventListener('click', () => {
    if (pressed) return;
    pressed = true; startBtn.disabled = true;
    if (CONFIG.musicaAutomatica && !started && cur < 0) startMusic();   // el toque permite el sonido
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { reveal(); return; }
    startEl.classList.add('playing');
    playBloom(reveal);
  });
  startBtn.focus();

  function frame() {
    requestAnimationFrame(frame);
    if (!began) {
      // un solo dibujo previo para cargar texturas y shaders mientras se ve el botón
      if (!prewarmed) { prewarmed = true; renderer.render(scene, camera); }
      return;
    }
    const dt = Math.min(clock.getDelta(), .05), t = clock.getElapsedTime();
    U.uTime.value = t;

    galaxyGroup.rotation.y += dt * .06;
    swirlGroup.rotation.y += dt * .35;

    // latido del corazón
    const beat = Math.pow(Math.max(0, Math.sin(t * 2.4)), 10) * .07 + Math.pow(Math.max(0, Math.sin(t * 2.4 - .5)), 10) * .03;
    heart.scale.setScalar(1 + beat * (musicPlaying ? 1.8 : 1));
    heart.lookAt(camera.position.x, heart.position.y, camera.position.z);

    // chispas ascendentes
    for (let i = 0; i < SPARK_N; i++) {
      sparkPos[i * 3 + 1] += sparkSpd[i] * dt;
      if (sparkPos[i * 3 + 1] > 90) sparkPos[i * 3 + 1] = -35;
    }
    sparks.geometry.attributes.position.needsUpdate = true;

    // flotantes
    for (const f of floaters) {
      const k = Math.min(1, Math.max(0, (t - f.born) / 1.3)), e = 1 - Math.pow(1 - k, 3);
      f.s.scale.set(f.w * e, f.h * e, 1);
      f.s.position.y = f.base.y + Math.sin(t * f.sp + f.ph) * f.amp;
      f.s.position.x = f.base.x + Math.cos(t * f.sp * .7 + f.ph) * f.amp * .5;
      if (f.spin) f.s.material.rotation = f.rot0 + t * f.spin;
    }

    // cámara (al principio se mueve más lento: vuelo cinematográfico de entrada)
    tTheta += 0; // la rotación manual se mantiene
    const kc = REDUCE ? .08 : .03 + .05 * clamp01((t - 3) / 4);
    theta += (tTheta - theta) * kc;
    phi += (tPhi - phi) * kc;
    radius += (tRadius - radius) * kc;
    const aspect = camera.aspect, fit = Math.max(1, .88 / aspect);
    const sway = Math.sin(t * .12) * .35, R = radius * fit, th = theta + sway;
    camera.position.set(
      target.x + R * Math.sin(phi) * Math.sin(th),
      target.y + R * Math.cos(phi),
      target.z + R * Math.sin(phi) * Math.cos(th)
    );
    camera.lookAt(target);

    // frases automáticas
    now = t;
    if (t > nextSpawn && active.filter(a => !a.user).length < MAX_AUTO && !document.hidden) {
      const [txt, k] = nextPhrase();
      spawnPhrase(txt, k);
      nextSpawn = t + (t < 4 ? .4 : rand(1.4, 2.4));
    }
    for (let i = active.length - 1; i >= 0; i--) {
      const a = active[i], age = t - a.born;
      if (age < 0) { a.s.visible = false; continue; }
      a.s.visible = true;
      if (a.pinned) a.life = Math.max(a.life, age + 2);
      if (age > a.life) {
        scene.remove(a.s); a.s.material.dispose(); active.splice(i, 1);
        continue;
      }
      const fin = Math.min(1, age / 1.2), e = 1 - Math.pow(1 - fin, 3);
      const fout = Math.min(1, (a.life - age) / 1.5);
      a.hover += ((a.hovered ? 1 : 0) - a.hover) * .2;
      a.s.material.opacity = e * fout;
      const sc = e * (1 + .14 * a.hover);
      a.s.scale.set(a.w * sc, a.h * sc, 1);
      a.s.position.set(
        a.base.x + Math.cos(t * a.sp * .7 + a.ph) * a.amp * .5,
        a.base.y + Math.sin(t * a.sp + a.ph) * a.amp + age * .25,
        a.base.z
      );
    }

    updateExtras(t, dt);
    updateShow(t, dt);

    renderer.render(scene, camera);
  }
  frame();
})();
</script>
</body>
</html>
